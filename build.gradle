plugins {
    id("net.fabricmc.fabric-loom-remap") version "1.15-SNAPSHOT"
    id("com.diffplug.spotless") version "8.0.0"
    id("me.modmuss50.mod-publish-plugin") version "1.1.0"
}

group = "me.ramidzkh"
version = System.getenv("VTS_VERSION") ?: "0.0.0"

dependencies {
    minecraft("net.minecraft:minecraft:${minecraft_version}")
    mappings(loom.officialMojangMappings())
    modImplementation("net.fabricmc:fabric-loader:${loader_version}")

    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

sourceSets {
    main {
        resources {
            srcDir("src/generated/resources")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    runs {
        create("data") {
            client()

            configName = "Data Generation"
            runDir = "build/data"

            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}")
            vmArg("-Dfabric-api.datagen.strict-validation")
            vmArg("-Dfabric-api.datagen.modid=villager-trading-station")
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

clean {
    delete("src/generated")
}

processResources {
    inputs.property("version", project.version)
    inputs.property("minecraft_version", minecraft_version)

    from("LICENSE")
    exclude(".cache")

    filesMatching("fabric.mod.json") {
        expand("version": project.version, "minecraft_version": minecraft_version)
    }
}

/////////////
// Spotless
spotless {
    java {
        target("src/main/java/**/*.java")

        endWithNewline()
        leadingSpacesToTabs()
        removeUnusedImports()
        toggleOffOn()
        eclipse().configFile("codeformat/codeformat.xml")
    }

    format("json") {
        target("src/main/resources/**/*.json")
        prettier().config(parser: "json")
    }
}

////////////////
// mod-publish-plugin
publishMods {
    displayName = project.version
    changelog = "View changelog at [the release page](https://github.com/ramidzkh/villager-trading-station/releases/tag/${project.version})"

    if (project.version.contains("alpha")) {
        type = ALPHA
    } else if (project.version.contains("beta")) {
        type = BETA
    } else {
        type = STABLE
    }

    file = remapJar.archiveFile
    modLoaders.add("fabric")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "694475"
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "xcE6J9Dq"
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
    }
}
